clause_types:
  - id: obligation
    label: Obligation
    description: "A duty or requirement imposed on a party"
  - id: right
    label: Right
    description: "An entitlement granted to a party"
  - id: responsibility
    label: Responsibility
    description: "A specific role or task a party is expected to perform"
  - id: deadline
    label: Deadline
    description: "A specific time limit or date by which an action must be completed"
  - id: payment
    label: Payment
    description: "Terms regarding financial compensation, fees, or amounts due"
  - id: penalty
    label: Penalty
    description: "Consequences for failing to meet obligations or deadlines"
  - id: termination
    label: Termination
    description: "Conditions under which the agreement can be ended"
  - id: renewal
    label: Renewal / Auto-renewal
    description: "Terms regarding the extension or continuation of the agreement"
  - id: confidentiality
    label: Confidentiality
    description: "Obligations to keep information secret (NDA terms)"
  - id: liability
    label: Liability
    description: "Limitations or allocations of legal and financial risk"
  - id: ip
    label: Intellectual Property
    description: "Ownership and rights regarding creations, patents, trademarks, etc."
  - id: non_compete
    label: Non-compete
    description: "Restrictions on working for competitors or in a specific field"
  - id: dispute_resolution
    label: Dispute Resolution
    description: "Methods for resolving conflicts (e.g., arbitration, mediation)"
  - id: governing_law
    label: Governing Law
    description: "The jurisdiction whose laws apply to the agreement"
