[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ekjot Singh", email = "ekjot9105@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain-openai>=1.6.3",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-magic-bin>=0.4.14",
    "python-multipart>=0.0.32",
    "spacy>=3.8.16",
    "sqlalchemy>=2.0.54",
    "langchain-text-splitters>=0.3.5",
    "pyyaml>=6.0.2",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
